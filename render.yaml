# Render Blueprint — web service only.
#
# NOTE: Background Workers require a PAID Render plan ("service type is not
# available for this plan" on free). On the free plan the collector + gridlock
# alerts must be triggered by an EXTERNAL scheduler (e.g. a GitHub Actions cron)
# hitting a secured endpoint on the web service. If you upgrade, re-add a
# `worker` service running `python manage.py start_collector`.
#
# Secrets are `sync: false` so Render prompts for them in the dashboard.
services:
  - type: web
    name: traffik
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput"
    startCommand: "gunicorn TrafficPro.wsgi"
    healthCheckPath: /healthz/
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: CRON_SECRET
        sync: false

{% load static %}
<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Password Reset Complete | Traffik</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
          tailwind.config = {
            darkMode: "class",
            theme: {
              extend: {
                colors: {
                  "surface": "#f7f9fc",
                  "primary": "#000666",
                  "primary-container": "#1a237e",
                  "on-primary": "#ffffff",
                  "on-primary-container": "#8690ee",
                  "surface-container-low": "#f2f4f7",
                  "surface-container-lowest": "#ffffff",
                  "on-surface": "#191c1e",
                  "on-surface-variant": "#454652",
                  "outline": "#767683",
                  "surface-tint": "#4c56af",
                },
                fontFamily: {
                  "headline": ["Manrope"],
                  "body": ["Inter"],
                },
              },
            },
          }
    </script>
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col">
    <main class="flex-grow flex items-center justify-center px-6 py-12 relative overflow-hidden">
        <div class="absolute inset-0 pointer-events-none overflow-hidden">
            <div class="absolute -top-24 -left-24 w-96 h-96 bg-primary/5 rounded-full blur-3xl"></div>
        </div>
        <div class="w-full max-w-[440px] relative z-10">
            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-primary-container mb-6 shadow-lg shadow-primary/10">
                    <span class="material-symbols-outlined text-on-primary-container text-4xl">check_circle</span>
                </div>
                <h1 class="font-headline text-3xl font-extrabold tracking-tighter text-primary">Traffik</h1>
                <p class="text-on-surface-variant mt-2 font-medium">Password Reset Complete</p>
            </div>
            <div class="glass-panel bg-surface-container-lowest rounded-xl p-8 md:p-10 shadow-[0_8px_24px_rgba(25,28,30,0.06)] ring-1 ring-outline-variant/20">
                <p class="mb-6 text-sm text-on-surface-variant text-center">Your password has been set. You may go ahead and log in now.</p>
                <div class="mt-8 pt-8 border-t border-outline-variant/20 text-center">
                    <a class="text-surface-tint font-semibold hover:text-primary transition-colors inline-flex items-center gap-1 group" href="{% url 'signin' %}">
                        Log In
                    </a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
